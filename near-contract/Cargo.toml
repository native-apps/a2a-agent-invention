[package]
name = "neighborly-registry"
version = "0.1.0"
edition = "2021"
description = "NEAR Neighbors registry — the onchain phone book for A2A agents (protocol over platform)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5", features = ["unit-testing", "legacy"] }
borsh = "1"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing", "legacy"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
