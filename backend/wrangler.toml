name = "motherbrain-a2a-endpoint"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# ── Heartbeat (Neighbors outreach cron) ──
# Fires every 30 minutes; the handler no-ops unless HEARTBEAT_ENABLED and the
# owner's schedule window is open (HEARTBEAT_SCHEDULE_JSON — interval /
# daily+time / weekly, timezone-aware). Runs are cheap: schedule check +
# at most one registry read + one knock.
[triggers]
crons = ["*/30 * * * *"]

[vars]
ENVIRONMENT = "production"
AI_MODEL = "default"
# CF_WORKER_MODEL, FORCE_CF_WORKER, CF_MAX_TOKENS, and CF_TEMPERATURE are
# plaintext [vars] that the Mother Brain app dynamically patches before deploy.
# They are NOT in config.json deploy.secrets (that would collide with [vars]).
#
# The app reads config.json → cfWorkerModel / forceCfWorker / cfMaxTokens /
# cfTemperature and writes the values into wrangler.toml before running
# wrangler deploy. This keeps them visible in the CF Dashboard (not encrypted).
CF_WORKER_MODEL = "@cf/zai-org/glm-4.7-flash"
FORCE_CF_WORKER = "false"
# Workers AI model parameters — control response length and creativity.
# These are patched dynamically by the MB app along with the above vars.
CF_MAX_TOKENS = "1024"
CF_TEMPERATURE = "0.7"

# Cloudflare Workers AI binding — used as an independent LLM for the offline
# fallback (when the MCP Gateway is unreachable). This lets the agent
# synthesize intelligent responses from Supabase-retrieved knowledge without
# needing the Gateway at all. Free tier: 10,000 neurons/day.
[ai]
binding = "AI"
# [ai] binding = "AI"

# ── Cloudflare Observability (Logs & Traces) ──
# Enables Cloudflare dashboard logging so we can see console.log output
# and debug the Workers AI function-calling path at runtime.
# Logs: enabled with 100% sampling + persist + invocation details.
# Traces: disabled (keep costs minimal on free plan).
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# NOTE: GATEWAY_BASE_URL, ENCORE_API_URL, and ENCORE_API_KEY are NOT hardcoded
# here — they are deployed as Cloudflare Worker secrets via the MB app
# Deploy action (mapped in config.json → actions.deploy.secrets).
#
# This keeps secrets out of the public repo. Set them in:
#   MB app → Settings → Agent Identity (Gateway URL + Token)
#   MB app → Settings → License Key Integration (Encore API URL + Key)
#   MB app → Settings → Session Token Verification (JWT Secret)
# Then click Deploy to push them to the Worker.

# Secrets to set via `wrangler secret put`:
# - SUPABASE_URL
# - SUPABASE_SERVICE_KEY
# - MOTHER_BRAIN_GATEWAY_TOKEN
# - MOTHER_BRAIN_USER_TOKEN   (Sub-Agent access token — Zero Trust attribution)
# - VOYAGE_API_KEY
#
# Workers AI model (offline fallback) — configured via Settings UI > Deploy > Workers AI Model.
# Plaintext [vars] are dynamically patched by the MB app before wrangler deploy
# using config.json → cfWorkerModel / forceCfWorker. Visible in CF Dashboard.
# Default (when patching not yet implemented): @cf/zai-org/glm-4.7-flash
#
# ── CF MCP Mirror (Cloudflare-hosted MCP Gateway Proxy) ──
# Optional. When set, the Worker can route MCP tool calls to this mirror when
# the local Mother Brain Gateway is unreachable. The mirror hosts the same MCP
# tools (search_codebase, search_memories, etc.) in the cloud.
# Also deployed as secrets via the Settings UI: MCP_CLOUD_URL, FORCE_CLOUD_MCP
# - MCP_CLOUD_URL  (e.g. https://mother-brain-mcp-cloud.nativeapps-cipher.workers.dev)
# - FORCE_CLOUD_MCP       ("true" to always route MCP tool calls to the CF mirror)
#
# ── Offline Fallback (Project Knowledge Base) ──
# Optional. When set, enables direct Supabase fallback when the MCP Gateway
# is unreachable. Points at the Mother Brain PROJECT's Supabase (different
# from SUPABASE_URL above, which is the A2A Agent's own chat-history DB).
# If unset, the Worker falls back to the existing placeholder response.
# - MB_SUPABASE_URL         (e.g. https://your-project-ref.supabase.co)
# - MB_SUPABASE_SERVICE_KEY (service_role key for the project Supabase)
# - MB_PROJECT_ID           (table prefix, e.g. your_project_id)
#
# ── Website MCP Server (motherbrain.app) ──
# Optional. When set, exposes website.* tools (read_page, navigate,
# get_account, etc.) to the A2A agent. When unset, the agent silently
# operates without website tools (graceful degradation — no behavior change).
# - MCP_BASE_URL  (e.g. https://api.motherbrain.app)
# - MCP_API_KEY   (mb_mcp_<hex> — distinct from MOTHER_BRAIN_GATEWAY_TOKEN)
# - WEBSITE_URL   (e.g. https://motherbrain.app — used for navigate/highlight links)
#
# ── License Key Resolution (Encore Subscriptions API) ──
# Optional. When set, in-app support messages with a license_key in
# metadata are resolved to a visitor_id via the Encore API lookup endpoint.
# This links in-app support chats with the visitor's web chat history.
# When unset, license keys fall back to `license:{key}` as the visitor_id.
# - ENCORE_API_URL  (e.g. https://api.motherbrain.app)
# - ENCORE_API_KEY  (optional auth for the Encore lookup endpoint)
#
# ── JWT Session Token Verification (Dual-Path Auth) ──
# Optional but required for JWT verification. When set, JWT session tokens
# sent by the website chat widget (Authorization: Bearer header) are verified
# using HMAC-SHA256. Shared secret from the Encore backend auth system.
# Fail-closed: if a JWT is sent but this is unset, the Worker returns 503.
# - JWT_SECRET  (64-char base64url string)
#
# ── Telegram Bot Integration ──
# Optional. When set, enables the Telegram webhook endpoint at
# POST /webhook/telegram. Visitors can chat with the agent in Telegram.
# Messages flow through the same A2A pipeline as website messages.
# When unset, the endpoint returns 503 (graceful degradation).
# - TELEGRAM_BOT_TOKEN  (from @BotFather)
